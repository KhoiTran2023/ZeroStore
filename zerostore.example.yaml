# ZeroStore settings, with every option shown.
# Only `sources` is required. The setup page writes this file for most people.
# Values like ${LLM_API_KEY} are read from environment variables, so keys never
# need to be written here. Tokens and access levels are managed with
# `zerostore token`, never in this file.

# Where company truth lives. ZeroStore only reads these; it never edits them.
sources:
  google_drive:
    folders: ["Company/Decisions", "Company/Pricing"]   # paths, or folder ids written as "id:1AbC..."
    credentials: ~/.zerostore/google-credentials.json   # from Sign in with Google, or a service account key
  github:
    repos: ["acme/app"]
    token: ${GITHUB_TOKEN}                              # needed for private repos
    include: ["*.md", "*.mdx", "*.markdown", "*.txt", "*.rst"]   # which files count as docs
  linear:
    teams: ["Product"]                                  # team names or keys
    api_key: ${LINEAR_API_KEY}

# When to check sources for changes (cron format). Default: daily at 06:00.
# `zerostore sync` runs a sync right away.
sync:
  schedule: "0 6 * * *"

# Your own AI account. Bring your own key. With no key at all, every change is
# applied directly and search isn't reranked (except by the local model, if installed).
ai:
  decision_engine: jev          # jev, or llm (clef later); jev is used only when its key is set
  jev_api_key: ${JEV_API_KEY}   # optional; without it, your LLM is used
  jev_model: jev-latest
  jev_base_url: https://api.typesafe.ai   # or another Jev-compatible endpoint
  llm_provider: anthropic       # anthropic, openai, gemini, openrouter, or ollama (local, no key)
  llm_model: mid-tier           # the provider's balanced model, or name any model
  llm_api_key: ${LLM_API_KEY}
  # llm_base_url: http://gpu-box:11434/v1   # only for a self-hosted or proxied endpoint
  embeddings: provider          # provider, or local (falls back to local if the provider has none)

# Changes at or above this confidence go live; lower ones wait in the review queue.
review:
  auto_apply_at: 0.80

# How agents' questions are answered.
retrieval:
  max_facts: 5                  # facts returned per question
  answer_cutoff: 0.50           # below this, answer "not sure" instead of weak facts
  rerank_rule: "Prefer the current decision over old discussion about it."
  narrow_with: auto             # auto, jev, llm, or off
  rerank_with: auto             # auto, jev, llm, local, or off
  topics:                       # what narrowing and topic tags choose from
    - pricing and plans
    - product and roadmap
    - customers and sales
    - engineering
    - people and hiring
    - finance
    - legal and security
    - marketing
    - operations
    - company strategy

# Optional: mark whole sources confidential. Only confidential and owner
# tokens can see them. With no rules, everything is non-confidential.
confidential:
  - google_drive: "Company/Finance"
  - linear_label: "hr"

agent_proposals: true           # agents may propose facts for you to approve
decisions_file: ~/.zerostore/decisions.md   # approved proposals land here and are read back as a source
web_ui: true

# Where each part runs and keeps its data.
servers:
  host: localhost               # serving beyond this machine requires HTTPS
  port: 8765
  vectordb: ~/.zerostore/facts.lance      # or s3://bucket/path
  statedb:  ~/.zerostore/state.sqlite     # Postgres comes later
